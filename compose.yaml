name: equipmap-community
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-equipmap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-equipmap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-equipmap}:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/${DB_NAME:-equipmap}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CHATGPT_ENABLED: ${CHATGPT_ENABLED:-false}
      CHATGPT_PUBLIC_URL: ${CHATGPT_PUBLIC_URL:-}
      CHATGPT_FRONTEND_URL: ${CHATGPT_FRONTEND_URL:-}
      CHATGPT_CLIENT_ID: ${CHATGPT_CLIENT_ID:-equipmap-chatgpt}
      CHATGPT_REDIRECT_URIS: ${CHATGPT_REDIRECT_URIS:-https://chatgpt.com/connector_platform_oauth_redirect}
    volumes:
      - ./uploads:/app/uploads
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      - backend
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      EQUIPMAP_ADDRESS: ${EQUIPMAP_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./hosting/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
volumes:
  postgres_data:
  backend_data:
  caddy_data:
  caddy_config:
