server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache sw.js, must be checked for updates every time
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Do not cache manifest.json
    location /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache hashed assets aggressively
    # Alpine Nginx does not consistently include an .mjs MIME mapping. PDF.js
    # loads its worker as an ES module, which browsers reject when it is served
    # as application/octet-stream with nosniff enabled.
    location ~* ^/assets/.+\.mjs$ {
        types {
            application/javascript mjs;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
