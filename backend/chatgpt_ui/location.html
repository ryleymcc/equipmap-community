<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EquipMap location</title><style>/* EQUIPMAP_CSS */</style></head>
<body><main class="location-panel" aria-labelledby="location-title">
<h1 id="location-title">Saved locations</h1>
<p id="location-status" role="status">Loading location preview…</p>
<div id="location-results" class="location-results"></div>
<template id="location-template"><section class="location-entry">
<h2 class="location-title"></h2>
<p class="location-context"></p>
<p class="location-message" role="status"></p>
<img class="location-image" hidden alt="">
<p class="location-caption location-context" hidden>Blue crosshair marks the saved location on page 1.</p>
<a class="location-link" hidden target="_blank" rel="noopener noreferrer">Open in EquipMap</a>
</section></template>
</main><script>/* EQUIPMAP_JS */</script></body></html>
